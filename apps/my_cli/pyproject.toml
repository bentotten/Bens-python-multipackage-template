[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-cli"
version = "0.1.0"
description = "CLI application for MyProject."
requires-python = ">=3.12"
dependencies = [
    "my-core",
]

[project.scripts]
my-project = "my_cli.cli:main"
cli = "my_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
