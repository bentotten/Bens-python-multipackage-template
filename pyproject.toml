# Manages pure Python dependencies and tool configuration.
# Non-Python dependencies (e.g. system libraries, CUDA, BLAS) belong in environment.yaml.

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-similarity-search"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = []

[project.scripts]
behavior-similarity-search = "behavior_similarity_search.cli:main"
bss = "behavior_similarity_search.cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.11.12",
    "mypy==1.16.0",
    "pytest==8.4.0",
    "pytest-cov==6.1.0",
    "sphinx==8.2.3",
    "sphinx-autodoc-typehints==3.1.0",
    "furo==2024.8.6",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
